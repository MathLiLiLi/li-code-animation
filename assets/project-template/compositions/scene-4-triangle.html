      <script>
        (function () {
          var OX = 460, OY = 620, S = 96, K = 4;
          var pts = [];
          for (var x = 0.9; x <= 4.25; x += 0.05) {
            pts.push((OX + x * S).toFixed(1) + "," + (OY - (K / x) * S).toFixed(1));
          }
          var p = document.getElementById("s4-curve");
          var real = "M " + pts.join(" L ");
          p.setAttribute("d", "M 0,0 L 10,0");
          p.getTotalLength();
          p.setAttribute("d", real);
          document.getElementById("s4-glow").setAttribute("d", real);
          p.setAttribute("stroke-dasharray", p.getTotalLength());
          p.setAttribute("stroke-dashoffset", p.getTotalLength());
          window.__s4len = p.getTotalLength();
        })();

        const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

        tl.fromTo("#s4-kicker", { y: -18, opacity: 0, filter: "blur(8px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.55 }, 0);
        tl.fromTo("#s4-axx", { attr: { x1: 460, x2: 460 }, opacity: 0 }, { attr: { x1: 120, x2: 880 }, opacity: 1, duration: 0.55, ease: "power2.out" }, 0.06);
        tl.fromTo("#s4-axy", { attr: { y1: 620, y2: 620 }, opacity: 0 }, { attr: { y1: 880, y2: 160 }, opacity: 1, duration: 0.55, ease: "power2.out" }, 0.14);
        tl.fromTo("#s4-curve",
          { attr: { "stroke-dashoffset": window.__s4len }, opacity: 0 },
          { attr: { "stroke-dashoffset": 0 }, opacity: 1, duration: 0.9, ease: "power2.inOut" }, 0.3);
        tl.to("#s4-glow", { opacity: 0.9, duration: 0.7 }, 0.5);

        tl.fromTo(["#s4-e1", "#s4-e3", "#s4-e4"], { opacity: 0 }, { opacity: 1, duration: 0.45, stagger: 0.08 }, 0.9);
        tl.fromTo("#s4-e2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.1);
        tl.set("#s4-e2", { opacity: 0 }, 1.9);

        tl.fromTo("#s4-poly", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 1.9);
        tl.fromTo(["#s4-lp", "#s4-la", "#s4-lo", "#s4-ra", "#s4-dot"], { opacity: 0 }, { opacity: 1, duration: 0.35, stagger: 0.07 }, 2.2);

        tl.fromTo("#s4-ghost", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 2.9);
        tl.fromTo("#s4-cap", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45 }, 3.3);

        tl.fromTo("#s4-l1", { opacity: 0, x: 26 }, { opacity: 1, x: 0, duration: 0.5 }, 3.9);
        tl.fromTo("#s4-l2", { opacity: 0, x: 26 }, { opacity: 1, x: 0, duration: 0.5 }, 5.4);
        tl.fromTo("#s4-l3", { opacity: 0, x: 26 }, { opacity: 1, x: 0, duration: 0.5 }, 6.8);

        tl.fromTo("#s4-card", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5 }, 9.4);
        tl.fromTo("#s4-c1", { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.4 }, 9.9);
        tl.fromTo("#s4-c2", { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.4 }, 10.6);
        tl.fromTo("#s4-c3", { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.4 }, 11.3);

        tl.to(["#s4-kicker", "#s4-cap", "#s4-l1", "#s4-l2", "#s4-l3", "#s4-card", "#s4-c1", "#s4-c2", "#s4-c3"], { opacity: 0, duration: 0.4, ease: "power2.in" }, 14.2);
        tl.to(["#s4-curve", "#s4-glow", "#s4-poly", "#s4-ghost", "#s4-e1", "#s4-e3", "#s4-e4", "#s4-lp", "#s4-la", "#s4-lo", "#s4-ra", "#s4-dot", "#s4-axx", "#s4-axy"], { opacity: 0, duration: 0.4, ease: "power2.in" }, 14.3);
