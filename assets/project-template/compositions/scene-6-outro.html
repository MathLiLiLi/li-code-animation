      <script>
        (function () {
          var OX = 960, OY = 430, S = 56, K = 4;
          function branch(signX) {
            var pts = [];
            for (var x = 1.0; x <= 5.6; x += 0.08) {
              pts.push((OX + signX * x * S).toFixed(1) + "," + (OY - (K / (signX * x)) * S).toFixed(1));
            }
            return "M " + pts.join(" L ");
          }
          document.getElementById("s6-q1").setAttribute("d", branch(1));
          document.getElementById("s6-q3").setAttribute("d", branch(-1));
          document.getElementById("s6-g1").setAttribute("d", branch(1));
          document.getElementById("s6-g3").setAttribute("d", branch(-1));
        })();
