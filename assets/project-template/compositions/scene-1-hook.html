<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  </head>
<body>
  <template>
    <style>
      #root {
        position: absolute;
        inset: 0;
        overflow: hidden;
        color: #e3edf9;
        font-family: "Inter", "HanSans", sans-serif;
        background: radial-gradient(ellipse at 24% 4%, #162b4f 0%, #0c1a30 46%, #050a14 100%);
      }
      .bg-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(120, 190, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(120, 190, 255, 0.05) 1px, transparent 1px);
        background-size: 96px 96px;
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 44% 46%, transparent 44%, rgba(2, 6, 14, 0.74) 100%);
      }
      .kicker {
        position: absolute;
        left: 84px;
        top: 70px;
        font-size: 26px;
        letter-spacing: 5px;
        color: #7d95b5;
      }
      .kicker b { color: #4dd7ff; font-weight: 600; letter-spacing: 7px; }
      .plot { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }

      .side { position: absolute; left: 986px; top: 0; width: 840px; }
      .side .mark {
        position: absolute;
        left: 0;
        top: 238px;
        width: 110px;
        height: 3px;
        background: linear-gradient(90deg, rgba(245, 185, 66, 0.9), rgba(245, 185, 66, 0.04));
      }
      .side .ln {
        position: absolute;
        left: 0;
        font-size: 48px;
        font-weight: 600;
        letter-spacing: 1px;
        color: #e3edf9;
        white-space: nowrap;
      }
      .side .ln.a { top: 282px; }
      .side .ln.b { top: 372px; }
      .side .ln.q {
        top: 494px;
        font-size: 58px;
        font-weight: 800;
        color: #4dd7ff;
      }
      .fig-note {
        position: absolute;
        left: 120px;
        top: 916px;
        font-size: 31px;
        color: #93aac6;
        letter-spacing: 1px;
        padding-left: 16px;
        border-left: 3px solid rgba(77, 215, 255, 0.42);
      }
          @font-face{font-family:"Inter";src:url("../assets/fonts/inter-400.woff2") format("woff2");font-weight:400;font-display:swap}@font-face{font-family:"Inter";src:url("../assets/fonts/inter-600.woff2") format("woff2");font-weight:600;font-display:swap}@font-face{font-family:"Inter";src:url("../assets/fonts/inter-700.woff2") format("woff2");font-weight:700;font-display:swap}@font-face{font-family:"Termes";src:url("../assets/fonts/termes-regular.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:"Termes";src:url("../assets/fonts/termes-italic.otf") format("opentype");font-weight:400;font-style:italic;font-display:swap}@font-face{font-family:"Termes";src:url("../assets/fonts/termes-bolditalic.otf") format("opentype");font-weight:700;font-style:italic;font-display:swap}
      /* 容器锁拉丁字体，中文交给 sans-serif 兜底 */
      .row, .cap, .tag, .note, .kicker, .same, .goal, .eqbox, .answer, .lbl, .cell, .head {
        font-family: "Inter", "HanSans", sans-serif;
      }
      /* 数学符号：教材同族衬线斜体（TeX Gyre Termes） */
      i, .row i, .cap i, .same i, .eq, .var, .eq i {
        font-family: "Termes", serif;
        font-style: italic;
      }

</style>

    <div id="root" data-composition-id="s1-hook" data-width="1920" data-height="1080">
      <div class="bg-grid" data-layout-allow-overflow></div>
      <div class="vignette"></div>

      <div class="kicker" id="s1-kicker">Vibe 知识大赏 ｜ <b>反比例函数 <i>k</i> 的几何意义</b></div>

      <svg class="plot" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="axArrow1" viewBox="0 0 10 10" refX="9" refY="5"
                  markerUnits="strokeWidth" markerWidth="10" markerHeight="10"
                  orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 Z" fill="#6f8db3" />
          </marker>
        </defs>
        <line id="s1-axx" x1="120" y1="620" x2="880" y2="620" stroke="#6f8db3" stroke-width="2.5" marker-end="url(#axArrow1)" />
        <line id="s1-axy" x1="460" y1="880" x2="460" y2="160" stroke="#6f8db3" stroke-width="2.5" marker-end="url(#axArrow1)" />
        <text x="890" y="630" fill="#7d95b5" font-size="30" font-family="'Termes', serif" font-style="italic">x</text>
        <text x="474" y="152" fill="#7d95b5" font-size="30" font-family="'Termes', serif" font-style="italic">y</text>
        <text x="418" y="656" fill="#7d95b5" font-size="30" font-family="'Termes', serif">O</text>

        <path id="s1-glow" d="M 460,620 L 460,620" fill="none" stroke="rgba(53,224,231,0.16)" stroke-width="17" stroke-linecap="round" />
        <path id="s1-curve" d="M 460,620 L 460,620" fill="none" stroke="#35e0e7" stroke-width="5" stroke-linecap="round" />

        <rect id="s1-ghost1" x="460" y="364" width="144" height="256" fill="none" stroke="rgba(53,224,231,0.22)" stroke-width="2" />
        <rect id="s1-ghost2" x="460" y="500" width="307" height="120" fill="none" stroke="rgba(53,224,231,0.22)" stroke-width="2" />

        <line id="s1-vd" x1="652" y1="428" x2="652" y2="620" stroke="rgba(53,224,231,0.85)" stroke-width="2.5" stroke-dasharray="7 7" />
        <line id="s1-hd" x1="460" y1="428" x2="652" y2="428" stroke="rgba(53,224,231,0.85)" stroke-width="2.5" stroke-dasharray="7 7" />
        <rect id="s1-rct" x="460" y="428" width="192" height="192" fill="rgba(53,224,231,0.18)" stroke="rgba(53,224,231,0.55)" stroke-width="2.5" />
        <circle id="s1-dot" cx="652" cy="428" r="9" fill="#f5b942" />
        <text id="s1-lp" x="668" y="414" fill="#f5b942" font-size="31" font-weight="700" font-family="'Termes', serif">P</text>
      </svg>

      <div class="fig-note" id="s1-figcap">点 P 在曲线上滑动，矩形跟着变</div>

      <div class="side">
        <div class="mark" id="s1-mark"></div>
        <div class="ln a" id="s1-t1">动点沿双曲线滑动</div>
        <div class="ln b" id="s1-t2">矩形形状一直在变</div>
        <div class="ln q" id="s1-t4">面积却始终不变？</div>
      </div>

    </div>

    <script>
      (function () {
        var OX = 460, OY = 620, S = 96, K = 4;
        var pts = [];
        for (var x = 0.9; x <= 4.25; x += 0.05) {
          pts.push((OX + x * S).toFixed(1) + "," + (OY - (K / x) * S).toFixed(1));
        }
        var real = "M " + pts.join(" L ");
        var c = document.getElementById("s1-curve");
        var g = document.getElementById("s1-glow");
        c.setAttribute("d", "M 0,0 L 10,0");
        c.getTotalLength();
        c.setAttribute("d", real);
        g.setAttribute("d", real);
        window.__s1len = c.getTotalLength();
        c.setAttribute("stroke-dasharray", window.__s1len);
        c.setAttribute("stroke-dashoffset", window.__s1len);
        g.setAttribute("opacity", "0");
      })();

      const OX = 460, OY = 620, SC = 96, KK = 4;
      function px(x) { return OX + x * SC; }
      function py(y) { return OY - y * SC; }

      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

      tl.fromTo("#s1-kicker", { y: -18, opacity: 0, filter: "blur(8px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.6 }, 0);
      tl.fromTo("#s1-axx", { attr: { x1: 460, x2: 460 }, opacity: 0 }, { attr: { x1: 120, x2: 880 }, opacity: 1, duration: 0.6, ease: "power2.out" }, 0.25);
      tl.fromTo("#s1-axy", { attr: { y1: 620, y2: 620 }, opacity: 0 }, { attr: { y1: 880, y2: 160 }, opacity: 1, duration: 0.6, ease: "power2.out" }, 0.45);
      tl.to("#s1-curve", { attr: { "stroke-dashoffset": 0 }, duration: 1.3, ease: "power2.inOut" }, 0.8);
      tl.to("#s1-glow", { opacity: 0.9, duration: 0.9 }, 1.1);

      tl.fromTo("#s1-dot", { scale: 0, opacity: 0, transformOrigin: "center center" }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 1.9);
      tl.fromTo("#s1-lp", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.35 }, 2.05);
      tl.fromTo("#s1-vd", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 2.1);
      tl.fromTo("#s1-hd", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 2.2);
      tl.fromTo("#s1-rct", { opacity: 0 }, { opacity: 1, duration: 0.55 }, 2.3);

      (function () {
        var N = 22, x0 = 2.0, x1 = 3.55, t0 = 2.9, dur = 2.9, seg = dur / N;
        for (var i = 0; i < N; i++) {
          var xa = x0 + (x1 - x0) * (i + 1) / N;
          var ya = KK / xa;
          var PX = px(xa), PY = py(ya), pos = t0 + i * seg;
          tl.to("#s1-dot", { attr: { cx: PX, cy: PY }, duration: seg, ease: "none" }, pos);
          tl.to("#s1-rct", { attr: { y: PY, width: PX - OX, height: OY - PY }, duration: seg, ease: "none" }, pos);
          tl.to("#s1-vd", { attr: { x1: PX, x2: PX }, duration: seg, ease: "none" }, pos);
          tl.to("#s1-hd", { attr: { y1: PY, y2: PY }, duration: seg, ease: "none" }, pos);
          tl.to("#s1-lp", { attr: { x: PX + 16, y: PY - 14 }, duration: seg, ease: "none" }, pos);
        }
      })();

      tl.fromTo("#s1-ghost1", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.1);
      tl.fromTo("#s1-ghost2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 4.0);
      tl.fromTo("#s1-figcap", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5 }, 3.0);

      tl.fromTo("#s1-mark", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.55, transformOrigin: "left center", ease: "power2.out" }, 2.9);
      tl.fromTo("#s1-t1", { opacity: 0, x: 26 }, { opacity: 1, x: 0, duration: 0.5 }, 3.0);
      tl.fromTo("#s1-t2", { opacity: 0, x: 26 }, { opacity: 1, x: 0, duration: 0.5 }, 3.9);
      tl.fromTo("#s1-t4", { opacity: 0, x: 26, scale: 0.96 }, { opacity: 1, x: 0, scale: 1, duration: 0.55, ease: "back.out(1.4)" }, 6.2);

      tl.to(["#s1-kicker", "#s1-figcap", "#s1-t1", "#s1-t2", "#s1-t4", "#s1-mark"], { opacity: 0, duration: 0.4, ease: "power2.in" }, 9.55);
      tl.to(["#s1-curve", "#s1-glow", "#s1-rct", "#s1-dot", "#s1-lp", "#s1-vd", "#s1-hd", "#s1-ghost1", "#s1-ghost2", "#s1-axx", "#s1-axy"], { opacity: 0, duration: 0.4, ease: "power2.in" }, 9.62);

      window.__timelines["s1-hook"] = tl;
    </script>
  </template>
  </body>
</html>
